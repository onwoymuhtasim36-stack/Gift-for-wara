<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak - Officer Cadet Abtahi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:ital,wght@0,300;0,400;1,500&display=swap');

        /* মিলিটারি ডার্ক গ্রিন ব্যাকগ্রাউন্ড */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1b3320 0%, #0a140c 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* সূক্ষ্ম গ্রিড বা টেক্সচার (মিলিটারি ম্যাপের মতো) */
        .tactical-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
        }

        /* মূল পোস্টার কন্টেইনার */
        .poster-card {
            display: flex;
            background: linear-gradient(135deg, rgba(20, 40, 24, 0.8) 0%, rgba(10, 20, 12, 0.9) 100%);
            backdrop-filter: blur(10px);
            border: 2px solid #d4af37; /* Royal Gold */
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(212, 175, 55, 0.1);
            width: 90%;
            max-width: 800px;
            z-index: 10;
            overflow: hidden;
            animation: fadeInCard 1.5s ease-out;
        }

        /* বাম পাশ (BMA Logo & Rank) */
        .left-panel {
            width: 35%;
            background: rgba(0, 0, 0, 0.3);
            border-right: 2px solid rgba(212, 175, 55, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
        }

        /* ডান পাশ (Message & Content) */
        .right-panel {
            width: 65%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        /* আসল BMA Logo Design */
        .bma-logo-img {
            width: 140px;
            height: 140px;
            border-radius: 50%; /* ছবিটিকে পুরোপুরি গোল করার জন্য */
            object-fit: cover;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            border: 3px solid #d4af37; /* লোগোর চারপাশে সোনালী বর্ডার */
            animation: floatLogo 4s ease-in-out infinite alternate;
        }

        .rank-title {
            margin-top: 20px;
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .bma-text {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
            text-align: center;
        }

        /* ডান পাশের টেক্সট ডিজাইন */
        .eid-greeting {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            margin: 0 0 5px 0;
            background: linear-gradient(to right, #ffffff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        
        .name-highlight {
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .divider {
            width: 50px;
            height: 3px;
            background: #d4af37;
            margin: 15px 0 25px 0;
            border-radius: 5px;
            box-shadow: 0 0 10px #d4af37;
        }

        .special-quote {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #e0e0e0;
            margin: 0 0 20px 0;
            font-style: italic;
            border-left: 3px solid #d4af37;
            padding-left: 15px;
            background: rgba(212, 175, 55, 0.05);
            padding: 15px;
            border-radius: 0 10px 10px 0;
        }

        .dua-text {
            font-size: 1.15rem;
            color: #d4af37;
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        /* ব্যাকগ্রাউন্ড চাঁদ */
        .crescent-bg {
            position: absolute;
            top: -30px;
            right: -30px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            box-shadow: inset -20px 10px 0 0 rgba(212, 175, 55, 0.1);
            transform: rotate(-30deg);
            z-index: -1;
        }

        /* অ্যানিমেশন */
        @keyframes fadeInCard { 0% { opacity: 0; transform: scale(0.9) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes floatLogo { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

        /* মোবাইল রেস্পন্সিভ */
        @media (max-width: 768px) {
            .poster-card { flex-direction: column; width: 95%; }
            .left-panel { width: 100%; border-right: none; border-bottom: 2px solid rgba(212, 175, 55, 0.3); padding: 20px; }
            .right-panel { width: 100%; padding: 25px; text-align: center; align-items: center; }
            .eid-greeting { font-size: 2.2rem; }
            .special-quote { font-size: 1.1rem; border-left: none; border-top: 2px solid #d4af37; border-radius: 10px; }
            .bma-logo-img { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <div class="tactical-grid"></div>

    <div class="poster-card">
        <div class="left-panel">
            
            <img src="bma-logo.jpg" alt="BMA Logo" class="bma-logo-img">

            <div class="rank-title">OFFICER CADET</div>
            <div class="bma-text">BANGLADESH MILITARY ACADEMY</div>
        </div>

        <div class="right-panel">
            <div class="crescent-bg"></div>

            <h1 class="eid-greeting">Eid Mubarak<br><span class="name-highlight">Abtahi.</span></h1>
            <div class="divider"></div>

            <div class="special-quote">
                Thanks for Being my most favourite Brother, <br>
                my most favourite Friend.
            </div>

            <div class="dua-text">
                May Almighty Allah always bless you Wara 🤍
            </div>
        </div>
    </div>

</body>
</html>
